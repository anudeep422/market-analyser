name: Pro research and daily scan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "research (10-year test) or daily (today's scan)"
        required: true
        default: research
        type: choice
        options: [research, daily]
  push:
    branches: [main]
    paths: ["pro.py", "scripts/pro_research.py", ".github/workflows/pro.yml"]
  schedule:
    - cron: "47 10 * * 1-5"   # 16:17 IST Mon-Fri, after market close -> daily scan
    - cron: "23 3 * * 0"      # 08:53 IST Sunday -> full research refresh

permissions:
  contents: write

concurrency:
  group: pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install pandas numpy yfinance tabulate
      - name: Choose mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.schedule }}" = "23 3 * * 0" ]; then
            echo "mode=research" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi
      - name: Run
        run: python scripts/pro_research.py ${{ steps.mode.outputs.mode }}
      - name: Commit results
        run: |
          git config user.name "market-analyser-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pro_stats.json reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Pro ${{ steps.mode.outputs.mode }} results $(date -u +%F)"
            git pull --rebase
            git push
          fi
